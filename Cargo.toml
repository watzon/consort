[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[workspace.dependencies]
# Internal crates
consort-proto = { path = "crates/consort-proto" }
consort-theme = { path = "crates/consort-theme" }
consort-harness = { path = "crates/consort-harness" }
consort-worker = { path = "crates/consort-worker" }
consort-hub = { path = "crates/consort-hub" }
consort-client = { path = "crates/consort-client" }
consort-testkit = { path = "crates/consort-testkit" }

# Wire contract (added by the proto agent)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
thiserror = "2.0.21"
schemars = "=1.2.3"

# Desktop app, theme and client (added by the desktop agent)
gpui-kit = "=0.8.1"
markdown = "=1.0.0"
# The SVG renderer that GPUI draws images with (gpui-pre 0.3.10). The
# desktop tests check that it draws the Three voices frames.
resvg = { version = "=0.46.0", default-features = false }
directories = "6"
# The QR code of the Pair a new app dialog (phase 3). Pure Rust, no image
# features.
qrcode = { version = "=0.14.1", default-features = false }
# macOS desktop notifications (phase 3). GPUI posts them; these give the Dock
# badge (NSDockTile) and the permission state. Their `unsafe` stays inside
# them. The versions match the ones that GPUI uses.
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSResponder"] }
mac-usernotifications = { version = "=0.3.1", default-features = false }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2"

# The unified diff of an ACP file change, for the task item view (phase 4).
# It is already in the tree; pinned to that version.
similar = "=2.7.0"

# Harness, worker, testkit and CLI (added by the worker agent)
tokio = { version = "1.48", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
async-trait = "0.1"
futures = "0.3"
agent-client-protocol = { version = "=3.6.0", features = ["process"] }
rmcp = { version = "=3.8.0", default-features = false }
axum = "0.8"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sha2 = "0.10"
toml = "1"
process-wrap = { version = "10", features = ["tokio1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.6", features = ["derive", "env"] }
anyhow = "1"
tempfile = "3"
which = "8"
gethostname = "1"

# Hub (added by the hub agent)
croner = "4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
# The time zone of a client, for the backup schedule.
iana-time-zone = "0.1"
# The free disk space in Settings > Hub (statvfs, Unix only).
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }
# Hub backup archives (also used by the managed tools).
# Encrypts the Composio key at rest (connectors, added by the hub agent)
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }

# Managed tools (added by the tools agent)
consort-tools = { path = "crates/consort-tools", default-features = false }
pgp = { version = "=0.21.0", default-features = false }
tar = "0.4.46"
flate2 = "1.1.10"
bzip2 = "0.6.1"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }

[profile.dev]
# Line tables only: backtraces keep their files and lines, and the linker
# writes far less debug info, which makes the large test binaries link fast.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
