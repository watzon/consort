[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[workspace.dependencies]
# Internal crates
consort-proto = { path = "crates/consort-proto" }
consort-theme = { path = "crates/consort-theme" }
consort-harness = { path = "crates/consort-harness" }
consort-worker = { path = "crates/consort-worker" }
consort-hub = { path = "crates/consort-hub" }
consort-client = { path = "crates/consort-client" }
consort-testkit = { path = "crates/consort-testkit" }

# Wire contract (added by the proto agent)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
thiserror = "2.0.21"
schemars = "=1.2.3"

# Desktop app, theme and client (added by the desktop agent)
gpui-kit = "=0.8.1"
markdown = "=1.0.0"
directories = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2"

# Harness, worker, testkit and CLI (added by the worker agent)
tokio = { version = "1.48", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
async-trait = "0.1"
futures = "0.3"
agent-client-protocol = { version = "=3.6.0", features = ["process"] }
rmcp = { version = "=3.8.0", default-features = false }
axum = "0.8"
rusqlite = { version = "0.41", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sha2 = "0.10"
toml = "1"
process-wrap = { version = "10", features = ["tokio1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.6", features = ["derive", "env"] }
anyhow = "1"
tempfile = "3"
which = "8"
gethostname = "1"

# Hub (added by the hub agent)
croner = "4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"

[profile.dev.package."*"]
opt-level = 1
