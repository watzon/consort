[package]
name = "consort-theme"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["gpui"]
# The GPUI Kit theme, the tokens and the theme runtime of the desktop app.
# Without it, the crate has the theme files, the roles, the contrast checks,
# the structure and the fonts.
gpui = ["dep:gpui-kit", "dep:directories"]

[dependencies]
gpui-kit = { workspace = true, optional = true }
directories = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile.workspace = true
