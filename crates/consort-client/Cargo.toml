[package]
name = "consort-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
consort-proto.workspace = true
chrono.workspace = true
similar.workspace = true
directories.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
gethostname.workspace = true
iana-time-zone.workspace = true
# The same Markdown parser that the GPUI text view uses (gpui-base 0.8.1), so
# the plain text of a message matches what the reader sees.
markdown.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["stream"] }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "fs", "io-util"] }
tokio-tungstenite.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["ws"] }
tempfile.workspace = true
