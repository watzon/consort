[package]
name = "consort-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Managed tools for Consort workers: downloads, checks, install layout, launch specs and the ACP registry types."

[lints]
workspace = true

[features]
# `install` adds the `ToolStore` (downloads, checks, archives, signatures).
# Without it, the crate has only the shared types, platform detection and the
# ACP registry parser. The hub uses it like that.
default = ["install"]
install = [
    "dep:reqwest",
    "dep:tokio",
    "dep:sha2",
    "dep:tar",
    "dep:flate2",
    "dep:bzip2",
    "dep:zip",
    "dep:pgp",
    "dep:rand",
    "dep:tracing",
]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
bzip2 = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
pgp = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
axum = { workspace = true }
tempfile = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
bzip2 = { workspace = true }
zip = { workspace = true }
sha2 = { workspace = true }
