[package]
name = "consort-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The Harness and HarnessSession traits and the ACP and Codex adapters."

[lints]
workspace = true

[dependencies]
consort-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
agent-client-protocol = { workspace = true }
process-wrap = { workspace = true }
tracing = { workspace = true }
which = { workspace = true }

# The creation flags for harness processes on Windows. `process-wrap` takes
# this type, and pins the same version.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }
