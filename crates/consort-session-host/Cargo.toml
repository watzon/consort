[package]
name = "consort-session-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The Consort session host: profiles, sign-ins, managed tools, harness processes and session journals."

[lints]
workspace = true

[dependencies]
consort-proto = { workspace = true }
consort-link = { workspace = true }
consort-harness = { workspace = true }
consort-tools = { workspace = true, features = ["install"] }
consort-visual = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
url = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
axum = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
directories = { workspace = true }
gethostname = { workspace = true }

# The renderer checks whether the effective user is root: the browser does not
# run as root unless the operator turns its sandbox off.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
consort-testkit = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
