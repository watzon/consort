<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink stress cases</title>
<!--
  Every Ink template with much more data than the gallery: the density rules, the readouts and the zoom.
  Open this file in a browser. Point at a chart, or focus it with Tab and use the arrow keys.
  The page can start in a state: stress.html#light,360 (mode, then width), and #only:treemap+bars.
-->
<style>
@font-face{font-family:"Atkinson Hyperlegible Next";font-weight:400;src:url("../../../design/fonts/AtkinsonHyperlegibleNext-Regular.ttf")}
@font-face{font-family:"Atkinson Hyperlegible Next";font-weight:400;font-style:italic;src:url("../../../design/fonts/AtkinsonHyperlegibleNext-Italic.ttf")}
@font-face{font-family:"Atkinson Hyperlegible Next";font-weight:500;src:url("../../../design/fonts/AtkinsonHyperlegibleNext-Medium.ttf")}
@font-face{font-family:"Atkinson Hyperlegible Next";font-weight:600;src:url("../../../design/fonts/AtkinsonHyperlegibleNext-SemiBold.ttf")}
@font-face{font-family:"Atkinson Hyperlegible Next";font-weight:700;src:url("../../../design/fonts/AtkinsonHyperlegibleNext-Bold.ttf")}
@font-face{font-family:"Atkinson Hyperlegible Mono";font-weight:400;src:url("../../../design/fonts/AtkinsonHyperlegibleMono-Regular.ttf")}
@font-face{font-family:"Atkinson Hyperlegible Mono";font-weight:500;src:url("../../../design/fonts/AtkinsonHyperlegibleMono-Medium.ttf")}
@font-face{font-family:"Atkinson Hyperlegible Mono";font-weight:600;src:url("../../../design/fonts/AtkinsonHyperlegibleMono-SemiBold.ttf")}

/* Spruce dark */
html{
  --background:#131E1A;--foreground:#F0EBDF;--muted:#1B2623;--muted-foreground:#B3BAB1;--subtle-foreground:#868F89;
  --card:#1B2623;--card-foreground:#F0EBDF;--popover:#222E2A;--popover-foreground:#F0EBDF;
  --border:#27322E;--input:#384440;--primary:#E7BE62;--primary-foreground:#2B2005;--accent:#3E3519;--accent-foreground:#EAC673;--ring:#EAC673;
  --destructive:#F1735A;--success:#80C7A8;--warning:#77B4ED;--info:#B2A0D6;
  --chart-1:#77B4ED;--chart-2:#80C7A8;--chart-3:#E7BE62;--chart-4:#B2A0D6;--chart-5:#E3929C;--chart-6:#8E9A94;--chart-ink:#131E1A;
  --radius-md:6px;--radius-lg:10px;
  --font-sans:"Atkinson Hyperlegible Next",system-ui,sans-serif;--font-mono:"Atkinson Hyperlegible Mono",ui-monospace,monospace;
}
/* Spruce light */
html[data-mode="light"]{
  --background:#F8FCF8;--foreground:#192622;--muted:#E9F2ED;--muted-foreground:#46534F;--subtle-foreground:#64706C;
  --card:#E9F2ED;--card-foreground:#192622;--popover:#FFFFFF;--popover-foreground:#192622;
  --border:#D8E1DD;--input:#C2CCC7;--primary:#E1B856;--primary-foreground:#2B2005;--accent:#F2E8C7;--accent-foreground:#93640B;--ring:#93640B;
  --destructive:#C1351E;--success:#237356;--warning:#1364B0;--info:#6D5398;
  --chart-1:#2F74C0;--chart-2:#2E8466;--chart-3:#B08419;--chart-4:#7559A6;--chart-5:#B9506A;--chart-6:#7A8781;--chart-ink:#FFFFFF;
}
/* The base sheet of the bootstrap */
html{padding:8px;background:var(--background);color:var(--foreground);font:14px/1.5 var(--font-sans);-webkit-font-smoothing:antialiased}
body{margin:0}
/* Gallery only */
#bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
#bar button{font:13px/20px var(--font-sans);color:var(--muted-foreground);background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:4px 12px;cursor:pointer}
#bar button[aria-pressed="true"]{color:var(--foreground);border-color:var(--input)}
#bar span{color:var(--subtle-foreground);font-size:12px;margin-right:4px}
#page{margin:0 auto;display:flex;flex-direction:column;gap:48px}
section h3{margin:0;font:600 13px/20px var(--font-sans);color:var(--foreground)}
section p{margin:0 0 16px;font:12px/16px var(--font-sans);color:var(--subtle-foreground)}
</style>
</head>
<body>
<div id="bar">
  <span>Mode</span><button data-mode="dark">Spruce dark</button><button data-mode="light">Spruce light</button>
  <span>Width</span><button data-w="360">360</button><button data-w="720">720</button><button data-w="0">Full</button>
</div>
<div id="page"></div>
<script src="ink.js"></script>
<script>
(function () {
  const rnd = Ink.pen.rng;
  const T = [];
  const add = (id, title, desc, fn) => T.push({id, title, desc, fn});
  const r = rnd(7);
  const gauss = () => { let a = 0; for (let i = 0; i < 6; i++) a += r(); return (a - 3) * 0.8165; };
  const words = ['sayso', 'homelab', 'miss-lucy-tg', 'house-lights', 'mac-ext4', 'Tutti', 'truenas', 'bigboi', 'jellyfin', 'immich', 'pi-hole', 'tailscale', 'backups', 'camera', 'vault', 'grafana', 'loki', 'minio', 'gitea', 'drone', 'nextcloud', 'paperless', 'frigate', 'zigbee', 'mosquitto', 'adguard', 'traefik', 'authelia', 'syncthing', 'restic'];
  const name = (i) => words[i % words.length] + (i >= words.length ? ' ' + (1 + Math.floor(i / words.length)) : '');
  const days = (a, n) => Array.from({length: n}, (_, i) => new Date(Date.UTC(2026, 0, 1) + (a + i) * 864e5).toISOString().slice(0, 10));

  add('treemap', 'Treemap, 40 tiles', 'The height grows with the count. Small tiles join one slate tile, and its readout lists them.', (t) =>
    Ink.treemap(t, {unit: 'GB', data: Array.from({length: 40}, (_, i) => [name(i), +(900 / Math.pow(i + 1, 1.7) + r() * 0.5).toFixed(1)])}));
  add('bars', 'Bars, 30 categories', 'Too many to stand, so the bars lie down in rows.', (t) =>
    Ink.bars(t, {unit: 'GB', data: Array.from({length: 30}, (_, i) => [name(i), i === 7 ? null : Math.round(20 + r() * 140), i === 7 ? 'Offline' : undefined])}));
  add('grouped', 'Grouped bars, 16 categories', 'Three series in each row. A hover on a legend name shows its bars.', (t) =>
    Ink.grouped(t, {labels: Array.from({length: 16}, (_, i) => name(i)), series: ['Two weeks ago', 'Last week', 'This week'].map((n) => ({name: n, values: Array.from({length: 16}, () => Math.round(5 + r() * 40))}))}));
  add('stacked', 'Stacked bars, 24 categories', 'Hourly, with the total at the end of each row.', (t) =>
    Ink.stacked(t, {labels: Array.from({length: 24}, (_, i) => String(i).padStart(2, '0') + ':00'), series: [{name: 'Done', color: 2, values: Array.from({length: 24}, () => Math.round(r() * 12))}, {name: 'Needs you', color: 3, values: Array.from({length: 24}, () => Math.round(r() * 3))}, {name: 'Failed', color: 5, values: Array.from({length: 24}, () => (r() > 0.8 ? 1 : 0))}]}));
  add('ranked', 'Ranked, 50 rows', 'Any number of rows. The height grows.', (t) =>
    Ink.ranked(t, {data: Array.from({length: 50}, (_, i) => [name(i), Math.round(400 / (i + 1) + r() * 6)])}));
  add('rankedtop', 'Ranked, 50 rows, top 10', 'top shows the first 10 and a row that opens the rest.', (t) =>
    Ink.ranked(t, {top: 10, unit: 'tasks', data: Array.from({length: 50}, (_, i) => [name(i), Math.round(400 / (i + 1) + r() * 6)])}));
  add('line', 'Line, 200 points and 8 series', 'More than six series take a legend. The readout lists every series at the x under the pointer. Pinch or use the buttons to zoom.', (t) => {
    const labels = days(0, 200).map((d) => new Date(d).toLocaleDateString('en-US', {month: 'short', day: 'numeric', timeZone: 'UTC'}));
    Ink.line(t, {labels, unit: 'ms', series: ['api', 'web', 'worker', 'hub', 'db', 'cache', 'queue', 'auth'].map((n, k) => { let x = 40 + k * 18; return {name: n, values: labels.map(() => +(x = Math.max(5, x + gauss() * 4)).toFixed(1))}; })});
  });
  add('scatter', 'Scatter, 1000 points', 'Small plain circles. The readout takes the nearest point. It can zoom.', (t) =>
    Ink.scatter(t, {xUnit: ' min', unit: 'K', xLabel: 'Time', yLabel: 'Tokens', points: Array.from({length: 1000}, (_, i) => { const m = Math.pow(r(), 1.3) * 180 + 2; return [+m.toFixed(1), Math.max(1, Math.round(m * 1.2 + gauss() * 25 + 10)), 'Run ' + (i + 1)]; })}));
  add('histogram', 'Histogram, 60 bins', 'Thin bins and thinned labels. Each bin has a readout.', (t) =>
    Ink.histogram(t, {unit: 's', start: 0, width: 0.5, mark: {at: 4.9, text: 'Half take under 4.9 s'}, counts: Array.from({length: 60}, (_, i) => Math.round(400 * Math.exp(-Math.pow(Math.log((i + 0.5) / 10), 2) * 1.6) + r() * 6))}));
  add('boxplot', 'Box plot, 10 groups', 'The rows grow.', (t) =>
    Ink.boxplot(t, {unit: 's', data: Array.from({length: 10}, (_, i) => ({name: name(i), values: Array.from({length: 60}, () => Math.max(0, +(10 + i * 2 + gauss() * (4 + i)).toFixed(1)))}))}));
  add('slope', 'Slope, 20 rows', 'The height grows, and the labels move apart.', (t) =>
    Ink.slope(t, {labels: ['September', 'October'], highlight: 'sayso', data: Array.from({length: 20}, (_, i) => [name(i), Math.round(5 + r() * 40), Math.round(5 + r() * 40)])}));
  add('funnel', 'Funnel, 9 steps', 'Each step reads as a share of the step above.', (t) => {
    let v = 1200;
    Ink.funnel(t, {data: ['Visited', 'Signed up', 'Opened the app', 'Paired a worker', 'Made a channel', 'Ran a task', 'Ran ten tasks', 'Invited someone', 'Paid'].map((n, i) => [n, i ? (v = Math.round(v * (0.55 + r() * 0.35))) : v])});
  });
  add('waterfall', 'Waterfall, 20 steps', 'Too many to stand, so the steps lie down in rows.', (t) =>
    Ink.waterfall(t, {unit: '$', data: [['Budget', 600, 'total']].concat(Array.from({length: 18}, (_, i) => [name(i), +(i === 5 ? 40 : -(5 + r() * 30)).toFixed(2)]), [['Left', null, 'total']])}));
  add('goal', 'Goal, 8 rows', 'The rows grow.', (t) =>
    Ink.goal(t, {data: Array.from({length: 8}, (_, i) => ({label: name(i) + ' disk', value: +(1 + r() * 7).toFixed(1), target: 8, unit: 'TB', limit: 7, limitLabel: i === 0 ? 'Warn at 7 TB' : undefined}))}));
  add('donut', 'Donut, 12 parts', 'Seven parts fold into Other. Its readout lists them. A hover on a legend row shows its part.', (t) =>
    Ink.donut(t, {data: Array.from({length: 12}, (_, i) => [name(i), Math.round(900000 / (i + 1.4))]), center: '2.4M', centerLabel: 'tokens'}));
  add('calendar', 'Calendar, 18 months', 'A long range wraps into rows of months. The keys move by day and by week.', (t) => {
    const data = {};
    days(-180, 548).forEach((d, i) => { const wd = new Date(d).getUTCDay(), v = Math.max(0, Math.round((wd > 0 && wd < 6 ? 3 : 0.6) * (0.4 + i / 548) + gauss() * 1.6)); if (v) data[d] = v; });
    Ink.calendar(t, {data, unit: 'tasks', note: 'Weekdays are the busiest.'});
  });
  add('week', 'Week, many overlaps', 'Overlapping events take lanes. Short events make the hours taller.', (t) => {
    const ev = [];
    for (let d = 0; d < 7; d++) for (let k = 0; k < 7; k++) { const a = 8 + Math.floor(r() * 18) / 2; ev.push({day: d, start: a, end: a + [0.25, 0.5, 1, 1.5][Math.floor(r() * 4)], title: ['Stand-up', 'Review', 'Call with Sam', 'Focus time', 'Lunch', 'Dentist', 'Deploy'][k], color: (k % 6) + 1}); }
    Ink.week(t, {days: ['Mon 3', 'Tue 4', 'Wed 5', 'Thu 6', 'Fri 7', 'Sat 8', 'Sun 9'], from: 8, to: 18, events: ev});
  });
  add('timeline', 'Timeline, 40 rows over 9 months', 'The names stay at the left. The time axis can zoom.', (t) =>
    Ink.timeline(t, {today: '2026-06-15', rows: Array.from({length: 40}, (_, i) => { const a = Math.floor(r() * 250), l = 2 + Math.floor(r() * 30); return i % 9 === 8 ? {label: 'Release ' + (i / 9 + 1).toFixed(0), start: days(a, 1)[0], state: 'milestone'} : {label: 'Task ' + (i + 1) + ': ' + name(i), start: days(a, 1)[0], end: days(a + l, 1)[0], state: a + l < 165 ? 'done' : a < 165 ? 'now' : 'next'}; })}));
  add('sankey', 'Sankey, 25 nodes', 'Five sources, twelve channels, eight outcomes.', (t) => {
    const src = ['Claude Work', 'Codex', 'Gemini', 'Local', 'Other models'], mid = Array.from({length: 12}, (_, i) => name(i)), out = ['Shipped', 'Merged', 'Drafted', 'Answered', 'Failed', 'Stopped', 'Waiting', 'Archived'], links = [];
    mid.forEach((m, i) => { links.push([src[i % 5], m, Math.round(50 + r() * 300) * 1000]); if (r() > 0.5) links.push([src[(i + 2) % 5], m, Math.round(20 + r() * 100) * 1000]); });
    mid.forEach((m, i) => { links.push([m, out[i % 8], Math.round(30 + r() * 150) * 1000]); links.push([m, out[(i + 3) % 8], Math.round(10 + r() * 60) * 1000]); });
    Ink.sankey(t, {unit: 'tokens', links});
  });
  add('sequence', 'Sequence, 8 parts and 20 messages', 'Many parts scale down a little, then the chart can zoom.', (t) => {
    const parts = ['You', 'Desktop app', 'Hub', 'Session host', 'Worker', 'Calendar', 'Monid', 'Search'], ms = [];
    for (let i = 0; i < 20; i++) { const a = Math.floor(r() * 8); let b = Math.floor(r() * 8); if (b === a) b = (a + 3) % 8; ms.push([parts[a], parts[b], ['Remind me at 5 PM', 'turn', 'create event', 'event ID', 'post_message', 'search the web for the release notes', 'ok'][i % 7], i % 3 === 2 ? 'reply' : undefined]); }
    Ink.sequence(t, {parts, messages: ms});
  });
  add('tree', 'Tree, 60 nodes', 'The rows get closer, and the readout gives a cut name in full.', (t) => {
    let i = 0;
    const kid = (d) => ({name: name(i++) + (d === 2 && i % 4 === 0 ? ' with a rather long name' : ''), detail: d === 2 && i % 3 === 0 ? 'Offline since 9:40 AM' : undefined, children: d < 2 ? Array.from({length: d === 0 ? 6 : 7 + (i % 3)}, () => kid(d + 1)) : undefined});
    Ink.tree(t, {name: 'homelab', children: kid(0).children});
  });
  add('flow', 'Flow, 15 steps', 'Too many steps for one row wrap into rows that read like text.', (t) =>
    Ink.flow(t, {steps: Array.from({length: 15}, (_, i) => [['Capture', 'Plan', 'Place', 'Start', 'Run', 'Check', 'Review', 'Merge', 'Build', 'Sign', 'Upload', 'Test', 'Release', 'Announce', 'Watch'][i], name(i)]), arrows: Array.from({length: 14}, (_, i) => (i % 3 ? '' : 'then')), back: 'a failure goes back to the plan', highlight: 6}));
  add('table', 'Table, 80 rows and 9 columns', 'The first 12 rows and a button for the rest. Wide, so it scrolls sideways with the first column fixed.', (t) =>
    Ink.table(t, {columns: ['PR', 'Title', 'Channel', 'State', 'Author', {name: 'Files', align: 'right'}, {name: 'Lines', align: 'right'}, 'Checks', {name: 'Age', align: 'right', tone: 2}], rows: Array.from({length: 80}, (_, i) => ['#' + (100 + i), ['Fix the Windows engine build so that the signed installer runs on ARM laptops', 'Tighten the spam rules', 'Move backups to homelab', 'Add a readout to every chart'][i % 4], name(i), {text: ['Ready to merge', 'Changes asked', 'Draft'][i % 3], color: [2, 5, 6][i % 3]}, ['Chris', 'Sam', 'Codex'][i % 3], String(1 + (i * 7) % 40), '+' + (10 + i * 13), i % 5 ? 'Passed' : 'Failed on macOS', (1 + i % 9) + ' days']).map((row) => row)}));
  add('numbers', 'Numbers, 8 tiles', 'More tiles wrap into even rows.', (t) =>
    Ink.numbers(t, {tiles: Array.from({length: 8}, (_, i) => ({label: name(i), value: String(10 + i * 7), delta: i % 2 ? (i + 1) + ' more' : undefined, spark: i % 3 === 0 ? Array.from({length: 12}, () => Math.round(10 + r() * 20)) : undefined, meter: i % 3 === 1 ? [3 + i, 20] : undefined}))}));
  add('readout', 'A readout function', 'readout: (item) => lines replaces the lines. Here it adds a line.', (t) =>
    Ink.bars(t, {unit: 'GB', readout: (it) => it.lines.concat(it.value > 100 ? 'Over 100 GB' : 'Under 100 GB'), data: [['hub', 42], ['homelab', 118], ['bigboi', 76]]}));
  add('zoom', 'A flow that asks for zoom', 'zoom: true gives the buttons to any chart that can zoom.', (t) =>
    Ink.flow(t, {zoom: true, steps: [['You', 'this Mac'], ['Hub', 'VPS'], ['Session host', 'hub machine'], ['Worker', 'homelab']], arrows: ['message', 'turn', 'tool call']}));

  add('heatbig', 'Heat map, 250 by 250 cells', 'A grid string with runs. The cells are drawn on a canvas. Pinch, Cmd or Ctrl with the wheel, or the buttons zoom, and a drag pans in x and y.', (t) =>
    Ink.heatmap(t, {grid: BIG, steps: [10, 20, 30, 40, 50, 60], unit: 'dBZ', notes: [[20, 'light rain'], [40, 'heavy rain'], [50, 'intense']],
      x: {min: -125, max: 125, unit: 'km', label: 'Kilometers east and north of the radar'}, y: {min: -125, max: 125, unit: 'km'}, aspect: 'equal',
      overlays: {paths: [{points: [[-110, -40], [-60, -20], [-20, 15], [5, 10], [30, 20], [60, 70]], dashFrom: 3}], markers: [{at: [0, 0], kind: 'place', label: 'Radar'}, {at: [-20, 15], kind: 'moment'}, {at: [60, 70], kind: 'end'}],
        notes: [{at: [-20, 15], lines: ['14:02', 'Into the cell']}, {at: [0, 0], lines: ['The radar']}]}}));
  add('heatvalues', 'Heat map, 96 by 64 numbers of a change', 'Rows of numbers from the bottom, diverging in seven steps with no steps given. Cells with no data stay canvas.', (t) => {
    const g = Array.from({length: 64}, (_, j) => Array.from({length: 96}, (_, i) => (i > 80 && j < 10 ? null : +(14 * Math.sin(i / 11) * Math.cos(j / 9) + 6 * Math.sin((i + j) / 7) + gauss() * 2).toFixed(1))));
    Ink.heatmap(t, {grid: g, origin: 'bottom', diverging: true, unit: '°C', x: {min: 0, max: 96, unit: 'h', label: 'Hours from the start'}, y: {min: 0, max: 64, unit: 'm'}});
  });
  add('heatyear', 'Heat map, a matrix of 53 weeks by 7 days', 'Tiles while they have room. At a narrow width the cells touch, as a field, and the labels thin out.', (t) =>
    Ink.heatmap(t, {rows: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], columns: Array.from({length: 53}, (_, i) => 'Week ' + (i + 1)),
      grid: Array.from({length: 7}, (_, d) => Array.from({length: 53}, (_, w) => Math.max(0, Math.round((d < 5 ? 6 : 2) * (0.5 + w / 60) + gauss() * 2.5)))), unit: 'tasks', color: 4}));

  // @@ENTRIES
  const page = document.getElementById('page');
  const hs = location.hash.slice(1).split(',');
  const only = (hs.find((x) => x.startsWith('only:')) || '').slice(5).split('+').filter(Boolean);
  if (only.length) T.splice(0, T.length, ...T.filter((o) => only.includes(o.id)));
  T.forEach((o) => {
    const s = document.createElement('section');
    s.innerHTML = `<h3>${o.title}</h3><p>${o.desc}</p><div id="c-${o.id}"></div>`;
    page.appendChild(s);
  });
  T.forEach((o) => o.fn('#c-' + o.id));

  // Switches
  const st = {mode: 'dark', w: 0};
  const apply = () => {
    document.documentElement.dataset.mode = st.mode;
    page.style.maxWidth = st.w ? st.w - 16 + 'px' : 'none';
    document.querySelectorAll('#bar button').forEach((b) => {
      const on = b.dataset.mode ? b.dataset.mode === st.mode : +b.dataset.w === st.w;
      b.setAttribute('aria-pressed', on);
    });
    history.replaceState(null, '', '#' + st.mode + (st.w ? ',' + st.w : '') + (only.length ? ',only:' + only.join('+') : ''));
  };
  document.getElementById('bar').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.mode) st.mode = b.dataset.mode;
    else st.w = +b.dataset.w;
    apply();
  });
  hs.forEach((x) => {
    if (x === 'light' || x === 'dark') st.mode = x;
    else if (+x) st.w = +x;
  });
  apply();
  // gallery.html#hover shows the readout of the first line chart, for a screenshot
  if (hs.includes('hover')) setTimeout(() => {
    const sv = document.querySelector('#c-line svg');
    if (!sv) return;
    const r = sv.getBoundingClientRect();
    sv.dispatchEvent(new PointerEvent('pointermove', {clientX: r.left + r.width * 0.72, clientY: r.top + 60, bubbles: true}));
  }, 600);
})();
