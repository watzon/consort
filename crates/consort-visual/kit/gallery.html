<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink gallery</title>
<!--
  Every Ink template with sample data from the designs (Paper G1, G5, G6, G7, G8).
  Open this file in a browser. The buttons switch the mode and the width.
  The page can start in a state: gallery.html#light,360 (mode, then width).
  The variables below are the plan's page style, set to Spruce.
  Point at a chart, or focus it with Tab and use the arrow keys, to see its readout.
  stress.html has the same templates with much more data.
-->
<style>
@font-face{font-family:"Atkinson Hyperlegible Next";font-weight:400;src:url("../../../design/fonts/AtkinsonHyperlegibleNext-Regular.ttf")}
@font-face{font-family:"Atkinson Hyperlegible Next";font-weight:400;font-style:italic;src:url("../../../design/fonts/AtkinsonHyperlegibleNext-Italic.ttf")}
@font-face{font-family:"Atkinson Hyperlegible Next";font-weight:500;src:url("../../../design/fonts/AtkinsonHyperlegibleNext-Medium.ttf")}
@font-face{font-family:"Atkinson Hyperlegible Next";font-weight:600;src:url("../../../design/fonts/AtkinsonHyperlegibleNext-SemiBold.ttf")}
@font-face{font-family:"Atkinson Hyperlegible Next";font-weight:700;src:url("../../../design/fonts/AtkinsonHyperlegibleNext-Bold.ttf")}
@font-face{font-family:"Atkinson Hyperlegible Mono";font-weight:400;src:url("../../../design/fonts/AtkinsonHyperlegibleMono-Regular.ttf")}
@font-face{font-family:"Atkinson Hyperlegible Mono";font-weight:500;src:url("../../../design/fonts/AtkinsonHyperlegibleMono-Medium.ttf")}
@font-face{font-family:"Atkinson Hyperlegible Mono";font-weight:600;src:url("../../../design/fonts/AtkinsonHyperlegibleMono-SemiBold.ttf")}

/* Spruce dark */
html{
  --background:#131E1A;--foreground:#F0EBDF;--muted:#1B2623;--muted-foreground:#B3BAB1;--subtle-foreground:#868F89;
  --card:#1B2623;--card-foreground:#F0EBDF;--popover:#222E2A;--popover-foreground:#F0EBDF;
  --border:#27322E;--input:#384440;--primary:#E7BE62;--primary-foreground:#2B2005;--accent:#3E3519;--accent-foreground:#EAC673;--ring:#EAC673;
  --destructive:#F1735A;--success:#80C7A8;--warning:#77B4ED;--info:#B2A0D6;
  --chart-1:#77B4ED;--chart-2:#80C7A8;--chart-3:#E7BE62;--chart-4:#B2A0D6;--chart-5:#E3929C;--chart-6:#8E9A94;--chart-ink:#131E1A;
  --radius-md:6px;--radius-lg:10px;
  --font-sans:"Atkinson Hyperlegible Next",system-ui,sans-serif;--font-mono:"Atkinson Hyperlegible Mono",ui-monospace,monospace;
}
/* Spruce light */
html[data-mode="light"]{
  --background:#F8FCF8;--foreground:#192622;--muted:#E9F2ED;--muted-foreground:#46534F;--subtle-foreground:#64706C;
  --card:#E9F2ED;--card-foreground:#192622;--popover:#FFFFFF;--popover-foreground:#192622;
  --border:#D8E1DD;--input:#C2CCC7;--primary:#E1B856;--primary-foreground:#2B2005;--accent:#F2E8C7;--accent-foreground:#93640B;--ring:#93640B;
  --destructive:#C1351E;--success:#237356;--warning:#1364B0;--info:#6D5398;
  --chart-1:#2F74C0;--chart-2:#2E8466;--chart-3:#B08419;--chart-4:#7559A6;--chart-5:#B9506A;--chart-6:#7A8781;--chart-ink:#FFFFFF;
}
/* The base sheet of the bootstrap */
html{padding:8px;background:var(--background);color:var(--foreground);font:14px/1.5 var(--font-sans);-webkit-font-smoothing:antialiased}
body{margin:0}
/* Gallery only */
#bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
#bar button{font:13px/20px var(--font-sans);color:var(--muted-foreground);background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:4px 12px;cursor:pointer}
#bar button[aria-pressed="true"]{color:var(--foreground);border-color:var(--input)}
#bar span{color:var(--subtle-foreground);font-size:12px;margin-right:4px}
#page{margin:0 auto;display:flex;flex-direction:column;gap:48px}
section h3{margin:0;font:600 13px/20px var(--font-sans);color:var(--foreground)}
section p{margin:0 0 16px;font:12px/16px var(--font-sans);color:var(--subtle-foreground)}
</style>
</head>
<body>
<div id="bar">
  <span>Mode</span><button data-mode="dark">Spruce dark</button><button data-mode="light">Spruce light</button>
  <span>Width</span><button data-w="360">360</button><button data-w="720">720</button><button data-w="0">Full</button>
</div>
<div id="page"></div>
<script src="ink.js"></script>
<script>
(function () {
  const rnd = Ink.pen.rng;
  const T = [];
  const add = (id, title, desc, fn) => T.push({id, title, desc, fn});

  // Paper G1 and G5: the line chart of the timeline and the light box.
  function diskSeries() {
    const r = rnd(4);
    const v = [];
    let x = 4.38;
    for (let d = 0; d < 30; d++) {
      x += 0.012 + r() * 0.03;
      if (d === 13) x += 0.86;
      v.push(+x.toFixed(2));
    }
    v[29] = 6.21;
    return v;
  }
  add('line', 'Line, one series (G1, G5)', 'The hover readout shows when you point at the chart. A note points at the jump.', (t) =>
    Ink.line(t, {
      labels: Array.from({length: 30}, (_, i) => 'Oct ' + (i + 1)),
      values: diskSeries(), unit: 'TB', min: 4, max: 7,
      notes: [{at: 13, text: 'Camera archive moved'}],
    }));
  add('lines', 'Lines, several series', 'Each line has its name at its end, so there is no legend to read. Past six lines, a legend takes their place.', (t) =>
    Ink.line(t, {
      labels: ['Sep 8', 'Sep 15', 'Sep 22', 'Sep 29', 'Oct 6', 'Oct 13', 'Oct 20', 'Oct 27'], unit: 's',
      series: [
        {name: 'Opus 5.5', values: [28, 26, 27, 24, 22, 23, 21, 19]},
        {name: 'Sonnet 5.5', values: [14, 15, 13, 13, 12, 12, 11, 11]},
        {name: 'Haiku 5.5', values: [6, 6, 5, 6, 5, 5, 4, 4]},
      ],
    }));
  add('bars', 'Bars (G6)', 'Compare a few things. The value sits on each bar. A missing value is a dashed stub with its reason.', (t) =>
    Ink.bars(t, {unit: 'GB', data: [['hub', 42], ['homelab', 118], ['bigboi', 76], ['MacBook Pro', 31], ['truenas', null, 'Offline']]}));
  add('donut', 'Donut (G6)', 'One brushstroke from the top, largest part first. Where two parts meet, the paints mix. Five parts at most.', (t) =>
    Ink.donut(t, {
      data: [['sayso', 912000], ['homelab', 576000], ['miss-lucy-tg', 432000], ['Tutti', 264000], ['house-lights', 216000]],
      center: '2.4M', centerLabel: 'tokens in October',
    }));

  add('ranked', 'Ranked bars (G7)', 'The top of a list, largest first. Names sit at the left and read in full. The value sits at the end of each bar.', (t) =>
    Ink.ranked(t, {data: [['sayso', 34], ['homelab', 21], ['miss-lucy-tg', 12], ['house-lights', 7], ['mac-ext4', 3]]}));
  add('stacked', 'Stacked bars (G7)', 'The parts of each total. Three parts at most, with the legend above. The largest part sits at the bottom.', (t) =>
    Ink.stacked(t, {
      labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
      series: [
        {name: 'Done', color: 2, values: [5, 7, 4, 8, 6, 2, 1]},
        {name: 'Needs you', color: 3, values: [1, 0, 2, 1, 0, 0, 1]},
        {name: 'Failed', color: 5, values: [0, 1, 0, 1, 0, 0, 0]},
      ],
    }));
  add('grouped', 'Grouped bars (G7)', 'Two or three things side by side in each group. The newest is lapis and sits at the right of its group.', (t) =>
    Ink.grouped(t, {
      labels: ['hub', 'homelab', 'bigboi', 'MacBook Pro'],
      series: [{name: 'Last week', values: [12, 30, 18, 9]}, {name: 'This week', values: [15, 41, 14, 13]}],
    }));
  add('histogram', 'Histogram (G7)', 'How values spread. Equal bins that touch, and one marked line for the median or a limit.', (t) =>
    Ink.histogram(t, {counts: [42, 118, 96, 61, 30, 18, 12, 9, 6, 4, 3, 2], start: 0, width: 5, unit: 's', mark: {at: 12, text: 'Half take under 12 s'}}));
  add('waterfall', 'Waterfall (G7)', 'How a total became another. Totals in lapis, rises in verdigris, falls in madder, and a pencil line carries the running total.', (t) =>
    Ink.waterfall(t, {unit: '$', data: [['Budget', 60, 'total'], ['Scrapes', -18.4], ['Enrichment', -12.3], ['Search', -7.1], ['Refund', 3], ['Left', null, 'total']]}));

  add('treemap', 'Treemap (G7)', 'What fills a whole when there are many parts. Area is the size. Text on a pigment uses --chart-ink.', (t) =>
    Ink.treemap(t, {unit: 'TB', data: [['Camera archive', 2.4], ['Media', 1.6], ['Backups', 1.1], ['Photos', 0.6], ['VMs', 0.3], ['Other', 0.2]]}));
  add('scatter', 'Scatter (G7)', 'How two numbers move together. Each dab is one thing. A pencil line shows the trend, and a gold dab with a note marks the one to look at.', (t) => {
    const r = rnd(9);
    const g = () => { let a = 0; for (let i = 0; i < 6; i++) a += r(); return (a - 3) * 0.8165; };
    const pts = [];
    for (let k = 0; k < 38; k++) {
      const m = Math.pow(r(), 1.15) * 150 + 4;
      pts.push([+m.toFixed(1), Math.max(6, Math.round(m * 1.15 + g() * 18 + 12))]);
    }
    pts.push([190, 362]);
    Ink.scatter(t, {points: pts, xUnit: ' min', unit: 'K', notes: [{at: pts.length - 1, text: 'Sayso Windows build, 3 h 10 min'}]});
  });
  add('slope', 'Slope (G7)', 'Before and after for a few things. One line in lapis carries the story, and the rest stay in slate.', (t) =>
    Ink.slope(t, {labels: ['September', 'October'], data: [['homelab', 26, 21], ['miss-lucy-tg', 10, 12], ['house-lights', 14, 7], ['mac-ext4', 5, 3], ['sayso', 18, 34]]}));
  add('boxplot', 'Box plot (G7)', 'How a few groups spread. The box holds the middle half, the thick line is the median, and dabs past the whiskers are outliers.', (t) =>
    Ink.boxplot(t, {unit: 's', data: [
      {name: 'Opus 5.5', stats: [6, 14, 19, 27, 44], outliers: [52, 58]},
      {name: 'Sonnet 5.5', stats: [3, 8, 11, 15, 24], outliers: [31]},
      {name: 'Haiku 5.5', stats: [1, 3, 4, 6, 9], outliers: [14, 17]},
    ]}));
  add('funnel', 'Funnel (G7)', 'How many go on at each step. The count sits in the bar, and the share of the step above sits beside it.', (t) =>
    Ink.funnel(t, {data: [['Captured', 48], ['Planned', 30], ['Started', 21], ['Shipped', 12]]}));

  add('sankey', 'Sankey (G7)', 'Where an amount went. Sources at the left in their pigments, and each ribbon keeps the color of its source.', (t) =>
    Ink.sankey(t, {unit: 'tokens', links: [['Claude Work', 'sayso', 0.5e6], ['Claude Work', 'homelab', 0.476e6], ['Claude Work', 'Tutti', 0.264e6], ['Claude Work', 'house-lights', 0.16e6], ['Codex', 'sayso', 0.412e6], ['Codex', 'homelab', 0.1e6], ['Codex', 'miss-lucy-tg', 0.432e6], ['Codex', 'house-lights', 0.056e6]]}));
  add('goal', 'Goal (G7)', 'How far along against a target or a limit. A painted track, the progress in its pigment, and a madder tick for a limit.', (t) =>
    Ink.goal(t, {data: [
      {label: 'Monid spend', value: 41.2, target: 60, unit: '$'},
      {label: 'Tasks this week', value: 23, target: 30, color: 2},
      {label: 'Disk on homelab', value: 6.2, target: 8, unit: 'TB', limit: 7, limitLabel: 'Warn at 7 TB'},
    ]}));
  add('calendar', 'Calendar (G7)', 'How often, day by day. One dab per day, and its size is the count, so the page needs one pigment only.', (t) => {
    const r = rnd(14), data = {};
    const start = Date.UTC(2026, 5, 29);
    for (let w = 0; w < 18; w++)
      for (let d = 0; d < 7; d++) {
        const base = ((d < 5 ? 3.4 : 0.7) + (d === 3 ? 1.6 : 0)) * (0.55 + 0.9 * (w / 18));
        let g = 0;
        for (let i = 0; i < 6; i++) g += r();
        const v = Math.max(0, Math.round(base + (g - 3) * 1.6 * 1.9 / 1.4));
        const day = new Date(start + (w * 7 + d) * 864e5);
        if (day.getTime() > Date.UTC(2026, 9, 31)) continue;
        if (v) data[day.toISOString().slice(0, 10)] = v;
      }
    Ink.calendar(t, {data, from: '2026-07-01', to: '2026-10-31', note: '246 tasks since July. Thursdays are the busiest.'});
  });
  add('week', 'Week (G7)', 'A schedule. Days across, hours down, events in the pigment of their calendar. A gold dab marks a clash.', (t) =>
    Ink.week(t, {
      days: ['Mon 3', 'Tue 4', 'Wed 5', 'Thu 6', 'Fri 7'], from: 8, to: 17,
      note: 'Friday: the dentist overlaps the stand-up.',
      events: [
        {day: 0, start: 9, end: 9.5, title: 'Stand-up', color: 6}, {day: 1, start: 9, end: 9.5, title: 'Stand-up', color: 6},
        {day: 2, start: 9, end: 9.5, title: 'Stand-up', color: 6}, {day: 3, start: 9, end: 9.5, title: 'Stand-up', color: 6},
        {day: 4, start: 8.5, end: 9.5, title: 'Dentist', color: 5}, {day: 4, start: 9, end: 9.5, title: 'Stand-up', color: 6},
        {day: 0, start: 13, end: 16, title: 'Windows build, focus time', color: 1}, {day: 1, start: 11, end: 11.5, title: 'Vendor call', color: 3},
        {day: 2, start: 14, end: 15, title: 'Sayso release review', color: 1}, {day: 3, start: 12, end: 13, title: 'Lunch with Sam', color: 2},
      ],
    }));
  add('timeline', 'Timeline (G7)', 'A plan against the calendar. Done in verdigris, now in lapis, next as a dashed outline, a gold dab for a date that matters, and a line for today.', (t) =>
    Ink.timeline(t, {
      from: '2026-10-24', to: '2026-11-15', today: '2026-11-01',
      rows: [
        {label: 'Update the docs', start: '2026-10-24', end: '2026-10-29', state: 'done'},
        {label: 'Fix the Windows engine', start: '2026-10-27', end: '2026-11-03', state: 'now'},
        {label: 'Sign the macOS build', start: '2026-11-03', end: '2026-11-06', state: 'next'},
        {label: 'Beta for testers', start: '2026-11-06', end: '2026-11-11', state: 'next'},
        {label: 'Release 1.4', start: '2026-11-12', state: 'milestone'},
      ],
    }));
  add('sequence', 'Sequence (G7)', 'Messages between parts, top to bottom. Calls are solid, answers are dashed, and each part keeps its own pencil lifeline.', (t) =>
    Ink.sequence(t, {
      parts: ['You', 'Hub', 'Session host', 'Calendar'],
      messages: [['You', 'Hub', 'Remind me at 5 PM'], ['Hub', 'Session host', 'turn'], ['Session host', 'Calendar', 'create event'], ['Calendar', 'Session host', 'event ID', 'reply'], ['Session host', 'Hub', 'post_message'], ['Hub', 'You', 'Done. 5 PM today.', 'reply']],
    }));
  add('tree', 'Tree (G7)', 'Parts within parts, left to right. Each branch keeps one pigment, and a leaf can carry one short detail.', (t) =>
    Ink.tree(t, {name: 'homelab', children: [
      {name: 'Storage', children: [{name: 'truenas', detail: 'Offline since 9:40 AM'}, {name: 'Backups', detail: 'Nightly, 2:00 AM'}]},
      {name: 'Media', children: [{name: 'Jellyfin', detail: '3 streams today'}, {name: 'Immich', detail: '41,302 photos'}]},
      {name: 'Network', children: [{name: 'Tailscale', detail: '6 devices'}, {name: 'Pi-hole', detail: '18% blocked'}]},
    ]}));
  add('flow', 'Flow (G6)', 'Steps left to right, with inked boxes and arrows. One path can stand out in lapis. It runs down the page when it is narrow.', (t) =>
    Ink.flow(t, {
      steps: [['You', 'this Mac'], ['Hub', 'VPS'], ['Session host', 'hub machine'], ['Worker', 'homelab']],
      arrows: ['message', 'turn', 'tool call'], back: 'the answer comes back to the chat', highlight: 3,
    }));
  add('numbers', 'Numbers (G6)', 'Two to four tiles. A box with its own ground gets 16 px padding and the theme radius.', (t) =>
    Ink.numbers(t, {tiles: [
      {label: 'Tasks done this week', value: '23', delta: '4 more', spark: [14, 17, 15, 19, 18, 21, 23]},
      {label: 'Waiting on you', value: '2', text: 'One approval and one decision, both in sayso.'},
      {label: 'Monid spend in October', value: '$41.20', of: 'of $60', meter: [41.2, 60]},
    ]}));
  add('table', 'Table (G6)', 'Rows on the canvas with no lines between them. One inked rule under the head. Numbers and IDs in mono, a dab for a state.', (t) =>
    Ink.table(t, {
      columns: ['PR', 'Title', 'Channel', 'State', {name: 'Age', align: 'right', tone: 2}],
      rows: [
        ['#62', 'Fix the Windows engine build', 'sayso', {text: 'Ready to merge', color: 2}, '2 days'],
        ['#58', 'Tighten the spam rules', 'miss-lucy-tg', {text: 'Changes asked', color: 5}, '4 days'],
        ['#71', 'Move backups to homelab', 'homelab', {text: 'Draft', color: 6}, '1 day'],
      ],
    }));
  add('spark', 'Sparkline and underline', 'A small line with a dab at its end, and a hand-drawn rule.', (t) => {
    const el = document.querySelector(t);
    el.innerHTML = '<div id="sp1"></div><p style="margin:16px 0 8px">Rule on an empty element</p><div id="ul1"></div><p style="margin:16px 0 0">An <span id="ul2">underlined phrase</span> inside a sentence.</p>';
    Ink.spark('#sp1', {values: [14, 17, 15, 19, 18, 21, 23]});
    Ink.underline('#ul1');
    Ink.underline('#ul2', {color: 3});
  });

  add('pen', 'Pen (custom drawings)', 'Ink.pen returns path strings in the same hand-drawn style, for a drawing that no template fits.', (t) => {
    const P = Ink.pen, c = Ink.pen.color;
    document.querySelector(t).innerHTML = `<svg viewBox="0 0 320 90" style="width:100%;max-width:420px"><path d="${P.rect(4, 22, 90, 46, {r: 10, seed: 3})}" fill="var(--card)" stroke="${c(1)}" stroke-width="1.5"/><path d="${P.arrow(100, 45, 190, 45, {seed: 5})}" fill="none" stroke="var(--subtle-foreground)" stroke-width="1.5" stroke-linecap="round"/><path d="${P.dab(236, 45, 22, {seed: 9})}" fill="${c(3)}"/><path d="${P.line([[20, 82], [300, 82]], {seed: 2})}" fill="none" stroke="var(--input)" stroke-width="1.2" stroke-linecap="round"/></svg>`;
  });
  // Paper G8: heat maps. The fields come from the design's generator as grid strings: one step index for each cell.

  const page = document.getElementById('page');
  const hs = location.hash.slice(1).split(',');
  const only = (hs.find((x) => x.startsWith('only:')) || '').slice(5).split('+').filter(Boolean);
  if (only.length) T.splice(0, T.length, ...T.filter((o) => only.includes(o.id)));
  T.forEach((o) => {

    s.innerHTML = `<h3>${o.title}</h3><p>${o.desc}</p><div id="c-${o.id}"></div>`;

  });
  T.forEach((o) => o.fn('#c-' + o.id));

  // Switches
  const st = {mode: 'dark', w: 0};
  const apply = () => {
    document.documentElement.dataset.mode = st.mode;
    page.style.maxWidth = st.w ? st.w - 16 + 'px' : 'none';
    document.querySelectorAll('#bar button').forEach((b) => {
      const on = b.dataset.mode ? b.dataset.mode === st.mode : +b.dataset.w === st.w;
      b.setAttribute('aria-pressed', on);
    });
    history.replaceState(null, '', '#' + st.mode + (st.w ? ',' + st.w : '') + (only.length ? ',only:' + only.join('+') : ''));
  };
  document.getElementById('bar').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.mode) st.mode = b.dataset.mode;
    else st.w = +b.dataset.w;
    apply();
  });
  hs.forEach((x) => {
    if (x === 'light' || x === 'dark') st.mode = x;
    else if (+x) st.w = +x;
  });
  apply();
  // gallery.html#hover shows the readout of the first line chart, for a screenshot
  if (hs.includes('hover')) setTimeout(() => {
    const sv = document.querySelector('#c-line svg');
    if (!sv) return;
    const r = sv.getBoundingClientRect();
    sv.dispatchEvent(new PointerEvent('pointermove', {clientX: r.left + r.width * 0.72, clientY: r.top + 60, bubbles: true}));

})();
