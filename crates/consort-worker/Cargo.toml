[package]
name = "consort-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The Consort worker daemon: hub link, spool, local MCP endpoint, workspaces and inventory."

[lints]
workspace = true

[dependencies]
consort-proto = { workspace = true }
consort-harness = { workspace = true }
consort-tools = { workspace = true, features = ["install"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
url = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
axum = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
directories = { workspace = true }
gethostname = { workspace = true }

[dev-dependencies]
consort-testkit = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
