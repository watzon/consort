[package]
name = "consort-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The Consort hub server: SQLite store, feed, pairing, coordinators, placement, hub tools and routines."
# The integration tests are one binary (tests/main.rs), not one per file.
autotests = false

[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true

[dependencies]
consort-proto = { workspace = true }
# Default features off: the registry types only, with no installer.
consort-tools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
axum = { workspace = true, features = ["ws"] }
rusqlite = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
croner = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
reqwest = { workspace = true }
aes-gcm = { workspace = true }
# Skill uploads (zip) and the temp folders of skill fetches.
zip = { workspace = true }
# The deflate backend of `zip` (its default `rust_backend`).
flate2 = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
tokio-tungstenite = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
